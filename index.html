<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Pendidikan Pancasila</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load React, ReactDOM, dan Babel untuk kompilasi JSX di browser -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <!-- Tulis JSX dalam script bertipe text/babel -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const questionsData = [
          { q: "Kata budaya berasal dari bahasa Sanskerta yaitu buddhayah yang memiliki arti hal-hal yang berkaitan dengan...", options: ["Kekayaan alam", "Akal budi manusia", "Kepercayaan leluhur", "Sejarah masa lalu"], ans: 1 },
          { q: "Bahasa yang digunakan sebagai bahasa persatuan bangsa Indonesia adalah...", options: ["Bahasa Jawa", "Bahasa Melayu", "Bahasa Indonesia", "Bahasa Daerah"], ans: 2 },
          { q: "Salah satu karya budaya Indonesia yang telah diakui oleh UNESCO sebagai warisan budaya dunia adalah...", options: ["Batik", "Lemper", "Pakaian sekolah", "Kendaraan hias"], ans: 0 },
          { q: "Sikap melestarikan budaya di tengah keragaman bangsa Indonesia merupakan perwujudan dari sila ke-... Pancasila.", options: ["Satu", "Dua", "Tiga", "Lima"], ans: 2 },
          { q: "Alat musik tradisional yang terbuat dari bambu dan berasal dari Jawa Barat adalah...", options: ["Sasando", "Angklung", "Kolintang", "Gamelan"], ans: 1 },
          { q: "Negara menjamin pemeliharaan dan pengembangan bahasa daerah yang tertuang dalam UUD NRI Tahun 1945 Pasal...", options: ["Pasal 31 ayat (1)", "Pasal 32 ayat (2)", "Pasal 33 ayat (1)", "Pasal 34 ayat (1)"], ans: 1 },
          { q: "Tradisi ziarah makam leluhur sebelum bulan puasa Ramadan di masyarakat Jawa dikenal dengan istilah...", options: ["Ngaben", "Kasada", "Nyadran", "Pasola"], ans: 2 },
          { q: "Kesenian Gambang Semarangan merupakan contoh budaya lokal yang berasal dari provinsi...", options: ["Jawa Timur", "Jawa Barat", "Jawa Tengah", "Banten"], ans: 2 },
          { q: "Siapakah yang memiliki kewajiban utama untuk melestarikan kebudayaan nasional?", options: ["Hanya pemerintah pusat", "Seluruh warga negara Indonesia", "Seniman dan budayawan saja", "Kementerian pendidikan"], ans: 1 },
          { q: "Budaya nasional Indonesia pada hakikatnya bersumber dari...", options: ["Budaya asing yang populer", "Budaya penjajah di masa lalu", "Puncak-puncak budaya daerah", "Budaya modern saat ini"], ans: 2 },
          { q: "Apa tujuan utama dari pelestarian tradisi dan budaya daerah di tengah arus globalisasi?", options: ["Menjadikan Indonesia negara paling ditakuti", "Menarik perhatian dunia agar mendapat bantuan", "Menjaga identitas dan jati diri bangsa agar tidak pudar", "Menutup diri dari pengaruh ilmu pengetahuan asing"], ans: 2 },
          { q: "Olimpiade Humaniora Nusantara merupakan contoh nyata upaya pelestarian budaya yang dilakukan di lingkungan...", options: ["Keluarga", "Masyarakat adat", "Sekolah", "Pemerintahan desa"], ans: 2 },
          { q: "Cara yang paling tepat bagi seorang pelajar untuk ikut serta melestarikan bahasa ibu di lingkungan keluarga adalah...", options: ["Mewajibkan semua teman menggunakan bahasa ibunya", "Membiasakan diri berkomunikasi dengan bahasa daerah di rumah", "Menolak untuk menggunakan bahasa Indonesia", "Mengubah bahasa daerah menjadi bahasa asing"], ans: 1 },
          { q: "Seni pertunjukan 'Terbang Gede' dari Serang, Banten mengalami akomodasi budaya dengan memasukkan kesenian...", options: ["Gamelan Jawa", "Musik Marawis", "Musik Keroncong", "Tari Jaipong"], ans: 1 },
          { q: "Pengertian dari akomodasi budaya dalam rangka melestarikan kearifan lokal adalah...", options: ["Menghilangkan budaya asli dan menggantinya dengan budaya baru", "Menggabungkan unsur baru tanpa menghilangkan substansi makna budaya asli", "Mewajibkan masyarakat mempraktikkan budaya kuno secara utuh", "Membangun gedung-gedung kesenian dengan biaya besar"], ans: 1 },
          { q: "Budaya nasional berfungsi sebagai alat pemersatu bangsa. Hal ini berarti...", options: ["Semua daerah harus memiliki satu budaya yang seragam", "Budaya nasional menjembatani berbagai perbedaan dan menjadi kebanggaan bersama", "Budaya dari suku terbesar akan mendominasi suku yang lebih kecil", "Tidak boleh ada lagi budaya daerah setelah adanya budaya nasional"], ans: 1 },
          { q: "Apa indikasi atau tanda bahwa jati diri bangsa di kalangan remaja mulai pudar?", options: ["Remaja yang lebih menyukai dan meniru gaya hidup serta tutur kata ala mancanegara", "Banyaknya remaja yang ikut dalam sanggar tari tradisional", "Meningkatnya pendaftaran remaja di sekolah-sekolah kesenian", "Remaja bangga memakai pakaian adat saat hari besar"], ans: 0 },
          { q: "Berikut ini yang bukan merupakan nilai-nilai luhur yang tercermin dalam jati diri bangsa Indonesia adalah...", options: ["Kesederhanaan dan gotong-royong", "Ramah tamah dan kekeluargaan", "Individualisme dan materialisme", "Patriotisme dan religiositas"], ans: 2 },
          { q: "Salah satu faktor penyebab pudarnya minat generasi muda terhadap budaya lokal adalah...", options: ["Pemerintah sering mengadakan festival budaya", "Gempuran budaya dan hiburan asing yang dianggap lebih modern", "Kurangnya dukungan biaya untuk kebudayaan asing", "Adanya kewajiban belajar muatan lokal di sekolah"], ans: 1 },
          { q: "Pasal 32 ayat (1) UUD NRI Tahun 1945 menjamin kebebasan masyarakat dalam memelihara dan mengembangkan nilai-nilai budayanya dengan tujuan untuk...", options: ["Menciptakan bahasa baru di Indonesia", "Memajukan kebudayaan nasional Indonesia di tengah peradaban dunia", "Membagi Indonesia menjadi beberapa negara kecil berdasarkan budaya", "Menghapus budaya asing yang masuk ke Indonesia"], ans: 1 },
          { q: "Akomodasi unsur budaya baru tidak boleh dilakukan secara serampangan. Siapakah yang paling berkapasitas untuk melakukan akomodasi budaya ini?", options: ["Pemerintah pusat melalui kementerian luar negeri", "Pegiat yang ahli dan sangat memahami filosofi budaya tersebut", "Pelajar dan mahasiswa yang aktif di dunia maya", "Pihak swasta yang memiliki modal besar"], ans: 1 },
          { q: "Di tengah pesatnya teknologi, bagaimana strategi yang paling efektif dan tepat sasaran untuk mempromosikan kebudayaan lokal kepada generasi digital native?", options: ["Mewajibkan jam malam agar pemuda tidak keluar rumah", "Melarang penggunaan internet di sekolah-sekolah", "Memanfaatkan platform media sosial untuk kampanye dan dokumentasi budaya kreatif", "Mencetak buku-buku tebal tentang sejarah budaya lokal untuk dibagi secara gratis"], ans: 2 },
          { q: "Tradisi 'Nyadran' pada masyarakat Jawa tidak hanya sekadar ziarah makam, melainkan memiliki nilai integrasi sosial berupa...", options: ["Persaingan antarwarga untuk menunjukkan kekayaan", "Kegiatan bersih-bersih desa yang mempererat silaturahmi dan gotong royong", "Unjuk kekuatan antar desa sebelum bulan Ramadan", "Perjanjian politik antara tetua desa"], ans: 1 },
          { q: "Hegemoni budaya asing sering kali mengancam kebudayaan nasional. Sikap kritis yang sesuai dengan nilai Pancasila dalam merespons hegemoni tersebut adalah...", options: ["Menolak secara ekstrem segala bentuk kebudayaan dari luar", "Menyaring budaya asing dan hanya menerima yang sejalan dengan nilai luhur bangsa", "Meniru sepenuhnya budaya asing agar terlihat seperti masyarakat global modern", "Menghilangkan identitas nasional dan menggantinya dengan identitas global"], ans: 1 },
          { q: "Kegiatan kolaborasi antarsekolah melalui Olimpiade Humaniora Nusantara membuktikan bahwa...", options: ["Hanya siswa pintar yang boleh mempelajari kebudayaan lokal", "Pelestarian budaya hanya menjadi tanggung jawab sekolah negeri", "Institusi pendidikan mampu menjadi wadah interaksi dan apresiasi lintas budaya antar daerah", "Dinas pendidikan tidak perlu campur tangan dalam pelestarian kebudayaan"], ans: 2 },
          { q: "Jika suatu kesenian daerah mulai ditinggalkan oleh generasi penerus (seperti kasus Gambang Semarangan), dampak sistemik yang dapat terjadi bagi kebudayaan nasional adalah...", options: ["Indonesia akan semakin cepat menjadi negara maju", "Meningkatnya devisa negara karena anggaran kesenian bisa dialihkan", "Hilangnya salah satu mata rantai pembentuk identitas kebudayaan nasional bangsa", "Kebudayaan nasional akan secara otomatis tergantikan oleh budaya provinsi lain"], ans: 2 },
          { q: "Menurut UUD NRI Tahun 1945, bahasa daerah berstatus sebagai...", options: ["Bahasa resmi negara yang wajib digunakan dalam acara kenegaraan", "Bahasa kuno yang harus disimpan di museum", "Kekayaan budaya nasional yang dihormati dan dipelihara oleh negara", "Bahasa kedua untuk transaksi ekonomi internasional"], ans: 2 },
          { q: "Pernyataan yang benar terkait hubungan antara identitas pribadi, sosial, dan bangsa dengan pelestarian budaya adalah...", options: ["Identitas bangsa tidak ada hubungannya dengan pelestarian budaya lokal", "Pelestarian budaya merupakan instrumen penting untuk meneguhkan identitas dari tingkat pribadi hingga menjadi karakteristik bangsa", "Identitas pribadi akan memudar jika seseorang mempertahankan budaya daerahnya", "Budaya hanya mencerminkan identitas sekelompok elite, bukan seluruh bangsa"], ans: 1 },
          { q: "Kebudayaan merupakan refleksi dari nilai-nilai yang dianut masyarakat. Dalam konteks Indonesia, kebudayaan nasional harus memancarkan nilai utama berupa...", options: ["Individualitas, sekularisme, dan materialisme", "Keseragaman mutlak tanpa adanya perbedaan pandangan", "Religiositas, gotong royong, persatuan, dan keadilan sosial", "Kebebasan tanpa batas dalam berekspresi"], ans: 2 },
          { q: "Mempelajari dan menghargai kebudayaan dari suku bangsa lain di Indonesia (misalnya pelajar dari Jawa mempelajari tarian dari Papua) merupakan bentuk langsung dari pengamalan...", options: ["Semboyan Bhinneka Tunggal Ika", "Paham Chauvinisme", "Sikap Etnosentrisme", "Paham Primordialisme"], ans: 0 }
        ];

        const GOOGLE_SHEETS_WEB_APP_URL = "https://docs.google.com/spreadsheets/d/1feDaPxC9dTMjONkP618wEikFg5zZILoWWfoDUVtlROI/edit?usp=sharing"; // <--- GANTI URL DI SINI

        const shuffleArray = (array) => {
          let shuffled = [...array];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          return shuffled;
        };

        function App() {
          const [user, setUser] = useState({ nama: '', kelas: '', tanggal: '' });
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [questions, setQuestions] = useState([]);
          const [currentQuestion, setCurrentQuestion] = useState(0);
          const [answers, setAnswers] = useState({});
          const [timeLeft, setTimeLeft] = useState(90 * 60);
          const [isFinished, setIsFinished] = useState(false);
          const [score, setScore] = useState(0);
          const [isSubmitting, setIsSubmitting] = useState(false);
          
          const [showConfirmModal, setShowConfirmModal] = useState(false);
          const [cheatWarnings, setCheatWarnings] = useState(0);
          const [showCheatModal, setShowCheatModal] = useState(false);

          const answersRef = useRef(answers);
          const questionsRef = useRef(questions);
          useEffect(() => { answersRef.current = answers; }, [answers]);
          useEffect(() => { questionsRef.current = questions; }, [questions]);

          useEffect(() => {
            let timerId;
            if (isLoggedIn && !isFinished && timeLeft > 0) {
              timerId = setInterval(() => {
                setTimeLeft((prev) => prev - 1);
              }, 1000);
            } else if (timeLeft === 0 && !isFinished && isLoggedIn) {
              handleFinishExam();
            }
            return () => clearInterval(timerId);
          }, [isLoggedIn, isFinished, timeLeft]);

          useEffect(() => {
            const handleVisibilityChange = () => {
              if (document.visibilityState === 'hidden' && isLoggedIn && !isFinished) {
                setCheatWarnings(prev => prev + 1);
              }
            };
            document.addEventListener("visibilitychange", handleVisibilityChange);
            return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
          }, [isLoggedIn, isFinished]);

          useEffect(() => {
            if (cheatWarnings === 1 && !isFinished) {
              setShowCheatModal(true);
            } else if (cheatWarnings >= 2 && !isFinished) {
              setShowCheatModal(false);
              handleFinishExam();
            }
          }, [cheatWarnings]);

          const handleLogin = (e) => {
            e.preventDefault();
            try {
              if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
              }
            } catch (err) {}

            const randomizedQuestions = shuffleArray(questionsData).map(q => {
              const optionsWithObjects = q.options.map((optText, idx) => ({
                text: optText,
                isCorrect: idx === q.ans
              }));
              return { ...q, options: shuffleArray(optionsWithObjects) };
            });

            setQuestions(randomizedQuestions);
            setIsLoggedIn(true);
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
          };

          const handleSelectAnswer = (qIndex, optionIndex) => {
            setAnswers({ ...answers, [qIndex]: optionIndex });
          };

          const hitungSkor = () => {
            let correct = 0;
            const currentQuestions = questionsRef.current;
            const currentAnswers = answersRef.current;
            currentQuestions.forEach((q, index) => {
              const selectedOptionIndex = currentAnswers[index];
              if (selectedOptionIndex !== undefined && q.options[selectedOptionIndex].isCorrect) {
                correct++;
              }
            });
            return Math.round((correct / currentQuestions.length) * 100);
          };

          const sendDataToGoogleSheets = async (finalScore) => {
            setIsSubmitting(true);
            const payload = {
              nama: user.nama,
              kelas: user.kelas,
              tanggal: user.tanggal,
              skor: finalScore
            };

            if (GOOGLE_SHEETS_WEB_APP_URL === "URL_APPS_SCRIPT_ANDA") {
              setTimeout(() => setIsSubmitting(false), 1000);
              return;
            }

            try {
              await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
            } catch (error) {
              console.error("Gagal mengirim", error);
            } finally {
              setIsSubmitting(false);
            }
          };

          const handleFinishExam = () => {
            const finalScore = hitungSkor();
            setScore(finalScore);
            setIsFinished(true);
            sendDataToGoogleSheets(finalScore);
          };

          if (!isLoggedIn) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                <div className="bg-white p-8 rounded-lg shadow-xl max-w-md w-full relative z-10">
                  <div className="text-center mb-6">
                    <div className="inline-flex items-center justify-center w-12 h-12 bg-blue-100 rounded-full mb-3">
                      <svg className="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h1 className="text-2xl font-bold text-gray-800">Ujian CBT Nasional</h1>
                    <p className="text-gray-500 text-sm mt-1">Pendidikan Pancasila - Bab 4</p>
                  </div>
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap</label>
                      <input type="text" required value={user.nama} onChange={(e) => setUser({...user, nama: e.target.value})} className="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Masukkan nama Anda" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Kelas</label>
                      <input type="text" required value={user.kelas} onChange={(e) => setUser({...user, kelas: e.target.value})} className="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Misal: VIII A" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Tanggal Ujian</label>
                      <input type="date" required value={user.tanggal} onChange={(e) => setUser({...user, tanggal: e.target.value})} className="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition" />
                    </div>
                    <div className="bg-orange-50 border border-orange-200 p-3 rounded-md mt-4">
                      <p className="text-xs text-orange-800 font-medium flex items-start">
                        <svg className="w-4 h-4 mr-1 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Perhatian: Sistem Anti-Kecurangan aktif. Anda tidak diizinkan membuka tab/aplikasi lain selama ujian berlangsung.
                      </p>
                    </div>
                    <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition shadow-lg mt-2">
                      Mulai Ujian (90 Menit)
                    </button>
                  </form>
                </div>
              </div>
            );
          }

          if (isFinished) {
            return (
              <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                <div className="bg-white p-8 rounded-lg shadow-xl max-w-md w-full text-center">
                  <h2 className="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                  <p className="text-gray-600 mb-4">Terima kasih, <span className="font-semibold">{user.nama}</span>.</p>
                  
                  {cheatWarnings >= 2 && (
                    <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6 text-left">
                      <div className="flex">
                        <div className="flex-shrink-0">
                          <svg className="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd"/></svg>
                        </div>
                        <div className="ml-3">
                          <h3 className="text-sm leading-5 font-medium text-red-800">Diskualifikasi / Peringatan</h3>
                          <div className="mt-2 text-sm leading-5 text-red-700">
                            <p>Ujian Anda diakhiri otomatis oleh sistem karena Anda terdeteksi meninggalkan halaman ujian melebihi batas yang diizinkan.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-6 shadow-inner">
                    <p className="text-sm text-blue-800 font-semibold mb-1">Nilai Anda:</p>
                    <p className="text-6xl font-black text-blue-600 tracking-tight">{score}</p>
                  </div>

                  {isSubmitting ? (
                    <p className="text-orange-500 text-sm animate-pulse font-medium">Menyimpan nilai ke sistem...</p>
                  ) : (
                    <p className="text-green-600 text-sm font-medium">✓ Nilai berhasil dikirim ke server.</p>
                  )}
                  
                  <button onClick={() => window.location.reload()} className="mt-8 text-sm text-gray-500 hover:text-blue-600 transition font-medium">
                    &larr; Kembali ke Halaman Awal
                  </button>
                </div>
              </div>
            );
          }

          const q = questions[currentQuestion];

          return (
            <div className="min-h-screen bg-gray-50 flex flex-col select-none">
              <header className="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-10">
                <div className="flex items-center gap-4">
                  <div>
                    <h1 className="font-bold text-lg hidden sm:block">CBT Pendidikan Pancasila</h1>
                    <p className="text-xs text-blue-200">{user.nama} | Kelas: {user.kelas}</p>
                  </div>
                  <span className="hidden md:inline-block px-2 py-1 bg-blue-800 text-blue-100 text-xs rounded-full font-medium border border-blue-600">Anti-Cheat Aktif</span>
                </div>
                <div className="flex items-center gap-2 bg-blue-900 bg-opacity-60 border border-blue-500 px-4 py-2 rounded-full shadow-inner">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  <span className={`font-mono font-bold ${timeLeft < 300 ? 'text-red-400 animate-pulse' : 'text-white'}`}>{formatTime(timeLeft)}</span>
                </div>
              </header>

              <main className="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col md:flex-row gap-6">
                <div className="flex-1 bg-white rounded-lg shadow border border-gray-200 flex flex-col">
                  <div className="p-6 flex-1">
                    <h2 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex justify-between">
                      <span>Soal No. {currentQuestion + 1}</span>
                    </h2>
                    <p className="text-gray-800 text-lg mb-6 leading-relaxed">{q.q}</p>
                    <div className="space-y-3">
                      {q.options.map((opt, idx) => {
                        const isSelected = answers[currentQuestion] === idx;
                        const char = String.fromCharCode(65 + idx);
                        return (
                          <label key={idx} className={`flex items-center p-4 rounded-lg border-2 cursor-pointer transition-all ${isSelected ? 'bg-blue-50 border-blue-500 shadow-sm' : 'hover:bg-gray-50 border-gray-200'}`}>
                            <input type="radio" name={`question-${currentQuestion}`} className="w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300" checked={isSelected} onChange={() => handleSelectAnswer(currentQuestion, idx)} />
                            <span className="ml-3 font-medium text-gray-800 flex-1 text-base">
                              <span className="mr-3 font-bold text-gray-400">{char}.</span> {opt.text}
                            </span>
                          </label>
                        )
                      })}
                    </div>
                  </div>
                  <div className="bg-gray-50 p-4 border-t flex justify-between rounded-b-lg">
                    <button onClick={() => setCurrentQuestion(prev => Math.max(0, prev - 1))} disabled={currentQuestion === 0} className={`px-5 py-2.5 rounded-md font-semibold transition ${currentQuestion === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white border hover:bg-gray-100 text-gray-700 shadow-sm'}`}>&larr; Sebelumnya</button>
                    <button onClick={() => setCurrentQuestion(prev => Math.min(questions.length - 1, prev + 1))} disabled={currentQuestion === questions.length - 1} className={`px-5 py-2.5 rounded-md font-semibold transition ${currentQuestion === questions.length - 1 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm'}`}>Selanjutnya &rarr;</button>
                  </div>
                </div>

                <div className="w-full md:w-72 flex-shrink-0 flex flex-col gap-4">
                  <div className="bg-white rounded-lg shadow border border-gray-200 p-5">
                    <h3 className="font-bold text-gray-800 mb-4 text-center border-b pb-2">Navigasi Soal</h3>
                    <div className="grid grid-cols-5 gap-2">
                      {questions.map((_, idx) => {
                        const isAnswered = answers[idx] !== undefined;
                        const isActive = currentQuestion === idx;
                        return (
                          <button key={idx} onClick={() => setCurrentQuestion(idx)} className={`h-10 w-full rounded flex items-center justify-center text-sm font-bold transition-all ${isActive ? 'ring-2 ring-blue-600 ring-offset-2 scale-110 z-10' : ''} ${isAnswered ? 'bg-green-500 text-white hover:bg-green-600 shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200 border border-gray-200'}`}>{idx + 1}</button>
                        )
                      })}
                    </div>
                    <div className="mt-5 pt-4 border-t flex flex-wrap gap-x-4 gap-y-2 text-xs text-gray-600 justify-center font-medium">
                      <div className="flex items-center gap-1.5"><span className="w-3 h-3 bg-green-500 rounded-sm inline-block"></span> Sudah Dijawab</div>
                      <div className="flex items-center gap-1.5"><span className="w-3 h-3 bg-gray-200 border border-gray-300 rounded-sm inline-block"></span> Belum Dijawab</div>
                    </div>
                  </div>
                  <div className="bg-white rounded-lg shadow border border-red-200 p-4">
                    <button onClick={() => setShowConfirmModal(true)} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-md shadow transition">Selesai Ujian</button>
                  </div>
                </div>
              </main>

              {showConfirmModal && (
                <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
                  <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl transform transition-all">
                    <div className="text-center mb-5">
                      <div className="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-100 mb-4">
                        <svg className="h-7 w-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                      </div>
                      <h3 className="text-xl leading-6 font-bold text-gray-900">Akhiri Ujian?</h3>
                      <div className="mt-2">
                        <p className="text-sm text-gray-500">Apakah Anda yakin ingin menyelesaikan ujian sekarang? Pastikan Anda sudah memeriksa kembali jawaban Anda.</p>
                      </div>
                    </div>
                    <div className="flex gap-3 w-full">
                      <button onClick={() => setShowConfirmModal(false)} className="flex-1 bg-white border border-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-md hover:bg-gray-50 transition">Batal</button>
                      <button onClick={() => { setShowConfirmModal(false); handleFinishExam(); }} className="flex-1 bg-red-600 text-white font-bold py-2.5 px-4 rounded-md hover:bg-red-700 shadow-md transition">Ya, Selesai</button>
                    </div>
                  </div>
                </div>
              )}

              {showCheatModal && (
                <div className="fixed inset-0 bg-red-900 bg-opacity-90 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                  <div className="bg-white rounded-xl p-8 max-w-md w-full shadow-2xl text-center transform scale-105 transition-transform">
                    <div className="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-100 mb-5 border-4 border-red-500 animate-pulse">
                      <svg className="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                    <h2 className="text-2xl font-black text-gray-900 mb-2">PERINGATAN PELANGGARAN!</h2>
                    <div className="bg-red-50 text-red-800 text-sm p-4 rounded-lg mb-6 border border-red-200">
                      Sistem mendeteksi Anda meninggalkan halaman ujian (beralih tab, membuka jendela lain, atau me-minimize browser). Ini merupakan pelanggaran aturan CBT.
                      <br/><br/><strong className="font-bold underline">Jika Anda mengulangi tindakan ini SATU KALI LAGI, ujian akan dihentikan secara sepihak dan diselesaikan otomatis.</strong>
                    </div>
                    <button onClick={() => setShowCheatModal(false)} className="w-full bg-red-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-red-700 shadow-lg transition-colors border-b-4 border-red-800 active:border-b-0 active:mt-1">SAYA MENGERTI, KEMBALI KE UJIAN</button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
